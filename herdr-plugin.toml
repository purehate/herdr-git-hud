id = "purehate.git-hud"
name = "Operation HUD"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Animated floating status for Git and wrapped development operations"
platforms = ["macos", "linux"]

[[build]]
command = ["go", "build", "-o", "bin/herdr-git-hud", "./cmd/herdr-git-hud"]

[[startup]]
command = ["./bin/herdr-git-hud", "daemon", "ensure"]

[[actions]]
id = "enable"
title = "Operation HUD: enable"
contexts = ["global"]
command = ["./bin/herdr-git-hud", "enable"]

[[actions]]
id = "disable"
title = "Operation HUD: disable"
contexts = ["global"]
command = ["./bin/herdr-git-hud", "disable"]

[[actions]]
id = "status"
title = "Operation HUD: status"
contexts = ["global"]
command = ["./bin/herdr-git-hud", "status"]

[[panes]]
id = "hud"
title = "Operation activity"
placement = "popup"
width = "90%"
height = "90%"
command = ["./bin/herdr-git-hud", "view"]
